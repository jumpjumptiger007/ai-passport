name: Sonic Link Pages

on:
  push:
    branches: [feature/sonic-link]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: sonic-link-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: web-companion/package-lock.json
      - name: Set up pinned Emscripten
        run: |
          git clone --no-checkout https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout b44154299bdefe75ba287874bb63fc9806243771
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.11
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.11
      - name: Validate and build Web Companion
        working-directory: web-companion
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run test:wasm
          npx playwright install --with-deps chromium
          npm run test:browser
          npm audit
          cat dist/version.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web-companion/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
